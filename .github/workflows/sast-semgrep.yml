name: SAST Security Analysis with Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # Job Único para Scan e Verificação de Segurança
  security_scan:
    runs-on: ubuntu-latest
    name: 1. Security Scan & Gate
    permissions:
      security-events: write
      contents: read
      pull-requests: write # Necessário para comentar no PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Scan
        id: semgrep_scan
        # continue-on-error é crucial para que os passos seguintes (upload, comentário) sempre rodem.
        continue-on-error: true
        run: |
          docker run --rm -v "${PWD}:/src" -w /src returntocorp/semgrep \
            semgrep scan --error --config "p/default" --config "p/trailofbits" --config .semgrep.yml --sarif -o semgrep.sarif /src

      - name: Upload SARIF report to GitHub Security Tab
        # Roda sempre para que os resultados estejam disponíveis na aba "Security".
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      
      - name: Comment PR with results on failure
        # Comenta apenas se o scan falhou e for um evento de PR.
        if: steps.semgrep_scan.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ❌ Falha na Análise de Segurança (SAST)
            
            **O pipeline foi bloqueado** devido a vulnerabilidades críticas ou de alta severidade.
            
            📋 Verifique os detalhes na aba [Security](https://github.com/${{ github.repository }}/security/code-scanning) do repositório para entender e corrigir os problemas.
            
            ### ⚠️ Ação Necessária
            - **Não faça o merge deste Pull Request.**
            - Corrija as vulnerabilidades apontadas.
            - Faça um novo push para esta branch para re-executar a análise.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Security Gate Check
        # Este é o passo final que efetivamente falha o job se o scan encontrou problemas.
        if: steps.semgrep_scan.outcome == 'failure'
        run: |
          echo "::error::O pipeline foi abortado! O scan de segurança encontrou vulnerabilidades críticas."
          exit 1

  # Job separado para Build e Deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    name: 2. Build and Deploy
    # Agora depende diretamente do sucesso do job de segurança unificado.
    needs: security_scan
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add execute permission to obfuscator
        run: chmod +x ./node_modules/.bin/javascript-obfuscator

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages [skip ci]'
          full_commit_message: 'Deploy to GitHub Pages - Build passed security analysis'