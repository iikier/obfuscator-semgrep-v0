name: SAST Security Analysis with Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep SAST Analysis
    permissions:
      security-events: write
      contents: read
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Semgrep Manually
        id: semgrep_scan
        # Instala e executa o Semgrep manualmente para ter controle total.
        # Isso contorna qualquer bug na semgrep-action.
        run: |
          pip install semgrep
          semgrep ci --config="p/security-audit" --config="p/owasp-top-ten" --config="p/cwe-top-25" --config="auto" --sarif --output="semgrep.sarif"
        continue-on-error: true
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: Fail pipeline on critical findings
        if: always()
        run: |
          # Verifica se o arquivo SARIF existe antes de tentar processá-lo
          if [ ! -f semgrep.sarif ]; then
            echo "::error::Arquivo de relatório semgrep.sarif não foi gerado. O scan pode ter falhado."
            exit 1
          fi
          
          # Instala jq se não estiver presente
          sudo apt-get -y install jq

          CRITICAL_FINDINGS=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          
          if [ "$CRITICAL_FINDINGS" -gt 0 ]; then
            echo "::error::O pipeline foi abortado! Foram encontradas $CRITICAL_FINDINGS vulnerabilidades críticas/altas."
            echo "Verifique a aba 'Security' para mais detalhes."
            exit 1
          else
            echo "Nenhuma vulnerabilidade crítica encontrada. Análise de segurança aprovada."
          fi

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            // Só comenta se houver resultados no relatório
            if (fs.existsSync('semgrep.sarif')) {
              const sarif = JSON.parse(fs.readFileSync('semgrep.sarif', 'utf8'));
              const findings = sarif.runs.reduce((acc, run) => acc + run.results.length, 0);

              if (findings > 0) {
                const body = `## 🔍 Análise de Segurança (SAST) - Semgrep
                **Vulnerabilidades encontradas:** ${findings}
                📋 Verifique os detalhes na aba [Security](https://github.com/${{ github.repository }}/security/code-scanning) do repositório.
                ### ⚠️ Ação Necessária
                - Revise as vulnerabilidades identificadas
                - Aplique as correções necessárias
                - Confirme que os riscos foram mitigados
                > **Trunk-based Development**: Correções de segurança devem ser aplicadas antes do merge para manter a qualidade da branch principal.`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            }

  build-and-deploy:
    needs: semgrep
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add execute permission to obfuscator
        run: chmod +x ./node_modules/.bin/javascript-obfuscator

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages [skip ci]'
          full_commit_message: 'Deploy to GitHub Pages - Build passed security analysis'