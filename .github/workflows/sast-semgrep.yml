name: SAST Security Analysis with Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep SAST Analysis
    permissions:
      # Required for uploading results to GitHub Security tab
      security-events: write
      contents: read
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Para análise completa do histórico em PRs
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Semgrep
        id: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          # Configuração genérica para múltiplos projetos
          # Detecta automaticamente linguagens no repositório
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.semgrep.outputs.findings != '0'
        with:
          script: |
            const findings = '${{ steps.semgrep.outputs.findings }}';
            const body = `## 🔍 Análise de Segurança (SAST) - Semgrep
            
            **Vulnerabilidades encontradas:** ${findings}
            
            📋 Verifique os detalhes na aba [Security](https://github.com/${{ github.repository }}/security/code-scanning) do repositório.
            
            ### ⚠️ Ação Necessária
            - Revise as vulnerabilidades identificadas
            - Aplique as correções necessárias
            - Confirme que os riscos foram mitigados
            
            > **Trunk-based Development**: Correções de segurança devem ser aplicadas antes do merge para manter a qualidade da branch principal.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  build-and-deploy:
    needs: semgrep
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add execute permission to obfuscator
        run: chmod +x ./node_modules/.bin/javascript-obfuscator

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages [skip ci]'
          full_commit_message: 'Deploy to GitHub Pages - Build passed security analysis' 