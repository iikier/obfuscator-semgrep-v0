name: SAST Security Analysis with Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    name: 1. Run Security Scan
    outputs:
      scan_conclusion: ${{ steps.semgrep_scan.conclusion }}
    permissions:
      security-events: write
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Scan
        id: semgrep_scan
        run: |
          pip install semgrep
          semgrep ci --config="p/security-audit" --config="p/owasp-top-ten" --config="p/cwe-top-25" --config="auto" --sarif --output="semgrep.sarif"
        continue-on-error: true
          
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  security_gate:
    runs-on: ubuntu-latest
    name: 2. Check Security Gate
    needs: scan
    permissions:
      pull-requests: write # Apenas para o comentário
      
    steps:
      - name: Check for critical findings
        if: needs.scan.outputs.scan_conclusion == 'failure'
        run: |
          echo "::error::O pipeline foi abortado! O scan de segurança encontrou vulnerabilidades críticas/altas."
          echo "Verifique os resultados do job '1. Run Security Scan' e a aba 'Security' para mais detalhes."
          exit 1
      
      - name: Approve security gate
        if: needs.scan.outputs.scan_conclusion != 'failure'
        run: echo "Nenhuma vulnerabilidade crítica encontrada. Análise de segurança aprovada."

      - name: Comment PR with results
        # Comenta apenas se o scan falhou e for um evento de PR
        if: needs.scan.outputs.scan_conclusion == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ❌ Falha na Análise de Segurança (SAST)
            
            **O pipeline foi bloqueado** devido a vulnerabilidades críticas ou de alta severidade.
            
            📋 Verifique os detalhes na aba [Security](https://github.com/${{ github.repository }}/security/code-scanning) do repositório para entender e corrigir os problemas.
            
            ### ⚠️ Ação Necessária
            - **Não faça o merge deste Pull Request.**
            - Corrija as vulnerabilidades apontadas.
            - Faça um novo push para esta branch para re-executar a análise.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  build-and-deploy:
    runs-on: ubuntu-latest
    name: 3. Build and Deploy
    needs: security_gate # Agora depende do portão de segurança
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add execute permission to obfuscator
        run: chmod +x ./node_modules/.bin/javascript-obfuscator

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy to GitHub Pages [skip ci]'
          full_commit_message: 'Deploy to GitHub Pages - Build passed security analysis'